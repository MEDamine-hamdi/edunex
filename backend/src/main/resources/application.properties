spring.application.name=backend
server.port=8099

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
app.storage.path=./storage

springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# AI assistant (Groq)
app.ai.groq-api-key=${GROQ_API_KEY}
app.ai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.ai.model=${GROQ_MODEL:openai/gpt-oss-120b}
app.ai.max-output-tokens=2048
app.ai.reasoning-effort=low
app.ai.timeout-seconds=60
app.ai.rate-limit-per-minute=15

# Platform
app.timezone=${APP_TIMEZONE:Africa/Tunis}
app.public-url=${APP_PUBLIC_URL:http://localhost:3000}
app.attendance.early-minutes=10
app.attendance.late-minutes=15
app.absence.min-hours-before=10
# Mail (Brevo): the key and the sender are read from backend/config or from environment variables
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.sender-email=${MAIL_SENDER_EMAIL:}
app.mail.sender-name=${MAIL_SENDER_NAME:EduNex}

# Never leak internals in error answers
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
# true on the server: the application refuses to start with weak secrets
app.security.strict=${APP_SECURITY_STRICT:false}
